<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeshiGram Admin • Listing Manager</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/admin-listings.css">
</head>
<body>
<header class="admin-topbar">
  <div><strong>DeshiGram Admin</strong><span>Listing Manager</span></div>
  <nav><a href="index.html" target="_blank">View Website</a><button id="logoutBtn" class="ghost" hidden>Logout</button></nav>
</header>

<main class="admin-shell">
<section id="loginPanel" class="login-card">
  <h1>Admin Login</h1>
  <p>Sign in with the DeshiGram admin account.</p>
  <form id="loginForm">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <button type="submit">Sign In</button>
    <p id="loginStatus" class="status"></p>
  </form>
</section>

<section id="adminApp" hidden>
  <div class="admin-heading">
    <div><span class="eyebrow">PRODUCT CONTROL CENTER</span><h1>Listings</h1><p>Products, inventory, offers, Coming Soon, visibility and seller approvals.</p></div>
    <button id="newProductBtn" class="primary">+ New DeshiGram Product</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button class="tab active" data-tab="own">DeshiGram Products</button>
    <button class="tab" data-tab="seller">Seller Listings</button>
  </div>

  <div class="toolbar">
    <input id="searchInput" type="search" placeholder="Search listings…">
    <select id="statusFilter"><option value="">All statuses</option><option>live</option><option>coming_soon</option><option>draft</option><option>paused</option><option>out_of_stock</option><option>under_review</option><option>changes_required</option><option>rejected</option><option>hidden</option></select>
    <button id="refreshBtn" class="ghost">Refresh</button>
  </div>

  <div id="ownPanel" class="listing-grid"></div>
  <div id="sellerPanel" class="listing-grid" hidden></div>
  <p id="appStatus" class="status"></p>
</section>
</main>

<dialog id="productDialog">
<form method="dialog" class="modal-card" id="productForm">
  <div class="modal-head"><div><span class="eyebrow">DESHIGRAM PRODUCT</span><h2 id="productDialogTitle">Edit Product</h2></div><button value="cancel" class="icon-btn" aria-label="Close">×</button></div>
  <input type="hidden" name="id">
  <div class="form-grid">
    <label class="span2">Product Name<input name="name" required></label>
    <label>Slug<input name="slug" placeholder="pack-1"></label>
    <label>SKU<input name="sku"></label>
    <label>Category<input name="category" value="DeshiGram"></label>
    <label>Net Quantity<input name="net_quantity" placeholder="100g × 1"></label>
    <label>MRP ₹<input name="mrp" type="number" step="0.01" min="0" required></label>
    <label>Selling Price ₹<input name="selling_price" type="number" step="0.01" min="0" required></label>
    <label>Stock<input name="stock_quantity" type="number" min="0" value="0"></label>
    <label>Packed Weight (g)<input name="packed_weight_grams" type="number" min="0"></label>
    <label>Max Qty / Order<input name="max_order_quantity" type="number" min="1" value="10"></label>
    <label>Low Stock Alert<input name="low_stock_threshold" type="number" min="0" value="5"></label>
    <label>Status<select name="status"><option value="live">Live</option><option value="coming_soon">Coming Soon</option><option value="draft">Draft</option><option value="paused">Paused</option><option value="out_of_stock">Out of Stock</option><option value="hidden">Hidden</option></select></label>
    <label>Coming Soon Date<input name="coming_soon_date" type="date"></label>
    <label>Sort Order<input name="sort_order" type="number" value="100"></label>
    <label>Badge Text<input name="badge_text" placeholder="BESTSELLER / NEW"></label>
    <label>Offer Type<select name="offer_type"><option value="none">No extra offer</option><option value="percent">% off selling price</option><option value="flat">₹ flat off selling price</option></select></label>
    <label>Offer Value<input name="offer_value" type="number" step="0.01" min="0" value="0"></label>
    <label>Offer Label<input name="offer_label" placeholder="Weekend Offer"></label>
    <label>Offer Starts<input name="offer_starts_at" type="datetime-local"></label>
    <label>Offer Ends<input name="offer_ends_at" type="datetime-local"></label>
    <label class="toggle"><input name="is_visible" type="checkbox" checked> Visible on website</label>
    <label class="toggle"><input name="featured" type="checkbox"> Featured / show first</label>
    <label class="toggle"><input name="cod_enabled" type="checkbox" checked> COD enabled</label>
    <label class="toggle"><input name="online_payment_enabled" type="checkbox" checked> Online payment enabled</label>
    <label class="span2">Short Description<textarea name="short_description" rows="2"></textarea></label>
    <label class="span2">Full Description<textarea name="description" rows="4"></textarea></label>
    <label class="span2">Ingredients <small>one per line</small><textarea name="ingredients" rows="4"></textarea></label>
    <label class="span2">Features <small>one per line</small><textarea name="features" rows="4"></textarea></label>
    <label class="span2">How to Use <small>one step per line</small><textarea name="usage_steps" rows="4"></textarea></label>
    <label class="span2">Storage Instructions<textarea name="storage_instructions" rows="2"></textarea></label>
    <label class="span2">Current Image Paths <small>one per line</small><textarea name="image_paths" rows="4"></textarea></label>
    <label class="span2 upload-box">Upload Product Images<input id="imageUpload" type="file" accept="image/*" multiple><small>Uploaded to DeshiGram product storage. Existing paths are retained unless you edit them.</small></label>
    <label class="span2">SEO Title<input name="seo_title"></label>
    <label class="span2">SEO Description<textarea name="seo_description" rows="2"></textarea></label>
  </div>
  <div class="modal-actions"><button value="cancel" class="ghost">Cancel</button><button type="button" id="deleteProductBtn" class="danger">Delete</button><button type="submit" class="primary">Save Product</button></div>
  <p id="productFormStatus" class="status"></p>
</form>
</dialog>

<dialog id="sellerDialog">
<form method="dialog" class="modal-card" id="sellerForm">
  <div class="modal-head"><div><span class="eyebrow">SELLER LISTING</span><h2 id="sellerTitle">Review Listing</h2></div><button value="cancel" class="icon-btn">×</button></div>
  <input type="hidden" name="id">
  <div class="form-grid">
    <label>Status<select name="status"><option value="under_review">Under Review</option><option value="live">Live</option><option value="coming_soon">Coming Soon</option><option value="paused">Paused</option><option value="out_of_stock">Out of Stock</option><option value="changes_required">Changes Required</option><option value="rejected">Rejected</option><option value="hidden">Hidden</option></select></label>
    <label>Seller Payout ₹<input name="seller_payout" type="number" step="0.01" min="0"></label>
    <label class="span2">Review Note<textarea name="review_note" rows="3"></textarea></label>
    <label>Coming Soon Date<input name="coming_soon_date" type="date"></label>
    <label>Badge Text<input name="badge_text"></label>
    <label>Offer Type<select name="offer_type"><option value="none">No offer</option><option value="percent">% off</option><option value="flat">₹ flat off</option></select></label>
    <label>Offer Value<input name="offer_value" type="number" step="0.01" min="0"></label>
    <label>Offer Label<input name="offer_label"></label>
    <label>Offer Starts<input name="offer_starts_at" type="datetime-local"></label>
    <label>Offer Ends<input name="offer_ends_at" type="datetime-local"></label>
    <label>Max Qty / Order<input name="max_order_quantity" type="number" min="1"></label>
    <label>Low Stock Alert<input name="low_stock_threshold" type="number" min="0"></label>
    <label class="toggle"><input name="is_visible" type="checkbox"> Visible</label>
    <label class="toggle"><input name="featured" type="checkbox"> Featured</label>
    <label class="toggle"><input name="cod_enabled" type="checkbox"> COD</label>
    <label class="toggle"><input name="online_payment_enabled" type="checkbox"> Online payment</label>
  </div>
  <div class="modal-actions"><button value="cancel" class="ghost">Cancel</button><button type="submit" class="primary">Save Review & Listing</button></div>
  <p id="sellerFormStatus" class="status"></p>
</form>
</dialog>

<script type="module" src="js/admin-listings.js"></script>
</body>
</html>
